<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0e0e18">
<title>Aboud Sayem</title>
<style>
/* ---------- Cairo, bundled: the app must render offline, and the system
     font renders Arabic poorly. Variable file, one per subset. ---------- */
@font-face{font-family:'Cairo';font-style:normal;font-weight:400 700;font-display:block;
  src:url('fonts/cairo-arabic.woff2') format('woff2');
  unicode-range:U+0600-06FF,U+0750-077F,U+0870-088E,U+0890-0891,U+0897-08E1,U+08E3-08FF,
    U+200C-200E,U+2010-2011,U+204F,U+2E41,U+FB50-FDFF,U+FE70-FE74,U+FE76-FEFC}
@font-face{font-family:'Cairo';font-style:normal;font-weight:400 700;font-display:block;
  src:url('fonts/cairo-latin.woff2') format('woff2');
  unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,
    U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}

*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}

/* ---------- theme ----------
   Surfaces and text come from the theme; the accent is a separate axis so
   picking a colour never touches contrast. `--scale` multiplies the whole
   type ramp, which keeps every size in proportion instead of letting the
   user grow body text into the headings. Both are set on <html> from
   settings at boot. */
:root{
  /* surfaces — dark (default) */
  --bg:#0e0e18;--surface:#171728;--surface-2:#1e1e33;--surface-3:#26263f;
  --line:#282844;--line-soft:#20203a;
  /* Accent — the one colour that means "this is interactive". It is kept
     clear of --danger on purpose: when the two are the same red, "add a
     meal", the selected tab and "delete everything" all look alike, and the
     user learns that red means "press me". Red belongs to destruction only. */
  --primary:#3d8bfd;--primary-dim:rgba(61,139,253,.14);
  --gold:#f5a623;--gold-dim:rgba(245,166,35,.13);
  --green:#00d97e;--green-dim:rgba(0,217,126,.13);
  --blue:#3d8bfd;--purple:#a259ff;--cyan:#00bcd4;
  /* Destructive only. Never a filled button outside a confirmation. */
  --danger:#ff4d5e;--danger-dim:rgba(255,77,94,.12);
  /* text */
  --text:#f2f2f7;--text-2:#9e9ebf;--text-3:#6b6b8c;
  /* type scale */
  --scale:1;
  --fs-xs:calc(11px * var(--scale));--fs-sm:calc(12.5px * var(--scale));
  --fs-md:calc(14px * var(--scale));--fs-lg:calc(16px * var(--scale));
  --fs-xl:calc(19px * var(--scale));--fs-2xl:calc(26px * var(--scale));
  --fs-3xl:calc(36px * var(--scale));
  /* spacing */
  --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:20px;--s6:26px;
  --r-sm:10px;--r:14px;--r-lg:20px;--r-pill:100px;
  /* Translucent chrome: literal rgba cannot follow a token, so the blurred
     header, nav and modal scrim carry their own theme-aware values. */
  --chrome:rgba(14,14,24,.86);--chrome-2:rgba(23,23,40,.94);--scrim:rgba(6,6,12,.78);
  --shadow:0 2px 10px rgba(0,0,0,.28);
  --shadow-lg:0 10px 34px rgba(0,0,0,.45);
  --nav-h:64px;--header-h:56px;
  --safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px);
  --ease:cubic-bezier(.22,.9,.3,1);
  /* Motion scale. One set of durations so nothing is timed by feel: t1 for a
     control acknowledging a touch, t2 for something appearing, t3 for a value
     travelling across a chart. --motion is multiplied into every duration so
     reduced-motion can collapse the lot to zero in one place. */
  --motion:1;
  --t1:calc(140ms * var(--motion));
  --t2:calc(240ms * var(--motion));
  --t3:calc(460ms * var(--motion))
}

/* Someone who has asked the system for less motion means it. Durations go to
   zero rather than the animations being removed, so state still lands exactly
   where it should — it just gets there instantly. */
@media (prefers-reduced-motion: reduce){
  :root{--motion:0.001}
  *,*::before,*::after{animation-iteration-count:1 !important}
}
/* Light: a genuine re-grounding, not the dark palette with the lightness
   inverted — borders and muted text need their own values to stay legible
   on white. */
html[data-theme="light"]{
  --bg:#f4f5f9;--surface:#ffffff;--surface-2:#eef0f6;--surface-3:#e3e6ef;
  --line:#d8dce8;--line-soft:#e6e9f2;
  --text:#15161f;--text-2:#5a5f75;--text-3:#8a90a8;
  --primary:#1f6feb;--primary-dim:rgba(31,111,235,.12);
  --danger:#d92b3a;--danger-dim:rgba(217,43,58,.10);
  --chrome:rgba(244,245,249,.88);--chrome-2:rgba(255,255,255,.94);--scrim:rgba(30,32,50,.42);
  --shadow:0 2px 10px rgba(20,22,40,.07);
  --shadow-lg:0 12px 34px rgba(20,22,40,.14);
}
/* Accent options deliberately exclude red: the picker must not be able to
   put the interactive colour back on top of the destructive one. */
html[data-accent="teal"]{--primary:#00b3a4;--primary-dim:rgba(0,179,164,.16)}
html[data-accent="amber"]{--primary:#f5a623;--primary-dim:rgba(245,166,35,.16)}
html[data-accent="green"]{--primary:#00b368;--primary-dim:rgba(0,179,104,.16)}
html[data-accent="purple"]{--primary:#a259ff;--primary-dim:rgba(162,89,255,.16)}

html,body{width:100%;height:100%;background:var(--bg);color:var(--text);
  font-family:'Cairo',system-ui,'Segoe UI',Roboto,sans-serif;
  font-size:var(--fs-md);font-weight:400;line-height:1.6;overflow:hidden;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  -webkit-user-select:none;user-select:none}
#root{width:100%;height:100%;display:flex;flex-direction:column}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}

/* ---------- motion ---------- */
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
@keyframes slideUp{from{transform:translateY(18px);opacity:0}to{transform:none;opacity:1}}
.anim{animation:rise var(--t2) var(--ease) both}
.anim-1{animation-delay:.03s}.anim-2{animation-delay:.07s}.anim-3{animation-delay:.11s}
.anim-4{animation-delay:.15s}.anim-5{animation-delay:.19s}

/* Motion that carries meaning, on the two properties a compositor can handle
   without touching layout or paint: transform and opacity. Everything below
   runs once on entrance — nothing loops, nothing animates while idle, and the
   whole set collapses to nothing under prefers-reduced-motion. */

/* Switching tabs: content arrives from slightly below, which reads as "this
   replaced that" rather than a hard cut. */
@keyframes tabIn{from{opacity:0;transform:translate3d(0,8px,0)}to{opacity:1;transform:none}}
.tab-anim{animation:tabIn var(--t2) var(--ease) both}

/* Cards stagger in behind it. Six steps is enough to read as a sequence; past
   that the last card arrives late enough to feel broken. */
.stagger > *{animation:tabIn var(--t2) var(--ease) both}
.stagger > *:nth-child(1){animation-delay:calc(20ms * var(--motion))}
.stagger > *:nth-child(2){animation-delay:calc(45ms * var(--motion))}
.stagger > *:nth-child(3){animation-delay:calc(70ms * var(--motion))}
.stagger > *:nth-child(4){animation-delay:calc(95ms * var(--motion))}
.stagger > *:nth-child(5){animation-delay:calc(120ms * var(--motion))}
.stagger > *:nth-child(n+6){animation-delay:calc(140ms * var(--motion))}

/* A pressed control gives way slightly. Cheap, and it is the difference
   between a button and a picture of a button. */
.btn:active,.nav-row:active,.goal-btn:active,.tile:active{transform:scale(.975)}
.btn,.nav-row,.goal-btn,.tile{transition:transform var(--t1) var(--ease)}

/* ---------- icons ---------- */
.ic{display:block;flex-shrink:0}
.ic-inline{display:inline-block;vertical-align:-3px;margin-inline-end:5px}

/* ---------- shell ---------- */
.hdr{height:calc(var(--header-h) + var(--safe-t));padding-top:var(--safe-t);
  display:flex;align-items:center;justify-content:space-between;padding-inline:var(--s4);
  background:var(--chrome);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  position:relative;z-index:10;border-bottom:1px solid var(--line-soft);flex-shrink:0}
.hdr-title{font-size:var(--fs-lg);font-weight:700;letter-spacing:-.2px}
.hdr-side{display:flex;align-items:center;gap:var(--s2)}
.hdr-chip{display:inline-flex;align-items:center;gap:5px;background:var(--surface-2);
  padding:5px 10px;border-radius:var(--r-pill);font-size:var(--fs-xs);font-weight:600;
  color:var(--text-2);border:1px solid var(--line)}
.content{flex:1;overflow-y:auto;overflow-x:hidden;padding:var(--s4);
  padding-bottom:calc(var(--nav-h) + var(--safe-b) + var(--s6));-webkit-overflow-scrolling:touch}

.bnav{height:calc(var(--nav-h) + var(--safe-b));padding-bottom:var(--safe-b);display:flex;
  background:var(--chrome-2);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-top:1px solid var(--line-soft);flex-shrink:0;z-index:10}
.bnav-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:none;border:none;color:var(--text-3);font-size:9.5px;font-weight:600;cursor:pointer;
  gap:4px;padding:6px 0;transition:color var(--t2) var(--ease)}
.bnav-item.active{color:var(--primary)}
.bnav-ico{position:relative;display:flex;align-items:center;justify-content:center;
  width:34px;height:26px;border-radius:var(--r-pill);transition:background-color var(--t2) var(--ease)}
.bnav-item.active .bnav-ico{background:var(--primary-dim)}

/* ---------- cards ---------- */
.card{background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--r-lg);
  padding:var(--s4);margin-bottom:var(--s3);box-shadow:var(--shadow)}
.card-flat{background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--r);
  padding:var(--s3);margin-bottom:var(--s3)}
.card-title{font-size:var(--fs-md);font-weight:700;margin-bottom:var(--s3);
  display:flex;align-items:center;gap:var(--s2);letter-spacing:-.1px}
.card-title .ic{color:var(--primary)}
.card-sub{font-size:var(--fs-sm);color:var(--text-2);line-height:1.75}
.section-title{font-size:var(--fs-xs);color:var(--text-3);font-weight:700;letter-spacing:.9px;
  text-transform:uppercase;margin:var(--s5) var(--s1) var(--s2)}

/* ---------- timer ---------- */
.ring-wrap{position:relative;width:250px;height:250px;margin:var(--s2) auto 0}
.ring-svg{transform:rotate(-90deg);filter:drop-shadow(0 0 12px rgba(233,69,96,.18))}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
  justify-content:center;text-align:center;gap:2px}
.timer-time{font-size:var(--fs-3xl);font-weight:700;font-variant-numeric:tabular-nums;
  letter-spacing:-1px;line-height:1.05;font-feature-settings:'tnum';
  display:flex;align-items:baseline;justify-content:center;gap:3px;direction:ltr}
/* Seconds are the only thing on this screen that moves every tick. At full
   size they pull the eye continuously to a digit that changes no decision. */
.timer-sec{font-size:var(--fs-lg);color:var(--text-3);letter-spacing:0;font-weight:600}
.timer-sec::before{content:':'}
.timer-goal{font-size:var(--fs-sm);color:var(--text-2)}
.timer-pct{font-size:var(--fs-md);font-weight:700;color:var(--gold)}
.timer-state{font-size:10px;color:var(--text-3);letter-spacing:1.6px;text-transform:uppercase;
  font-weight:600;margin-top:var(--s1)}
.timer-state.reached{color:var(--green);font-weight:700}

.phase-name{text-align:center;font-size:var(--fs-xl);font-weight:700;margin-top:var(--s3);
  letter-spacing:-.3px}
.phase-desc{text-align:center;font-size:var(--fs-sm);color:var(--text-2);margin-top:var(--s1);
  line-height:1.7;padding:0 var(--s2)}
.phase-next{text-align:center;font-size:var(--fs-xs);color:var(--text-3);margin-top:6px}

.timeline-wrap{position:relative;margin:var(--s4) 0 6px}
.timeline{display:flex;height:8px;border-radius:var(--r-pill);overflow:hidden;
  background:var(--line);gap:2px}
/* Where you are right now, not just which phases are behind you. */
/* No transition. The marker is repositioned on every tick while a fast runs,
   so a 460ms transition on a layout property never completed before the next
   one started — it reflowed the strip continuously to animate a 3px element
   between two positions a few pixels apart. Setting the position outright
   costs one layout per second instead of sixty. */
.timeline-marker{position:absolute;top:-4px;width:3px;height:16px;border-radius:2px;
  background:#fff;box-shadow:0 0 8px rgba(255,255,255,.5)}
.timeline-seg{flex:1;background:var(--line);transition:background-color var(--t3) var(--ease)}
/* Absolutely positioned on the segment boundaries, so a label sits exactly
   where its phase begins instead of being spread evenly across the row. */
.timeline-labels{position:relative;height:14px;font-size:9.5px;color:var(--text-3);
  margin-bottom:var(--s1);font-weight:600}
.timeline-label{position:absolute;top:0;transform:translateX(-50%)}
[dir="rtl"] .timeline-label{transform:translateX(50%)}
.timeline-label:first-child{transform:none}
[dir="rtl"] .timeline-label:first-child{transform:none}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;
  padding:12px 20px;border:none;border-radius:var(--r-pill);font-size:var(--fs-md);
  font-weight:700;color:#fff;cursor:pointer;transition:transform var(--t1) var(--ease),filter .2s,opacity .2s}
.btn:disabled{opacity:.45}
.btn-primary{background:var(--primary)}
.btn-gold{background:var(--gold);color:#20160a}
.btn-green{background:var(--green);color:#04281a}
/* Outlined, not filled: a destructive action should never be the most
   attractive thing on screen. The solid variant exists only for the final
   button inside a confirmation, where destroying is what was asked for. */
.btn-danger{background:var(--danger-dim);border:1px solid var(--danger);color:var(--danger)}
.btn-danger-solid{background:var(--danger);color:#fff}
.btn-outline{background:var(--surface-2);border:1px solid var(--line);color:var(--text-2)}
.btn-ghost{background:transparent;color:var(--text-2);padding:0 14px;min-height:44px}
.btn-sm{padding:0 16px;min-height:44px;font-size:var(--fs-sm)}
.btn-block{width:100%}
.btn-group{display:flex;gap:var(--s2);justify-content:center;flex-wrap:wrap;margin-top:var(--s4)}

/* Chips wrap rather than scroll.
   They used to sit in one horizontal scroller behind an edge fade, which hid
   110px of a 456px row inside a 346px container — a fade tells you something
   is over there but not that it is tappable, and the first thing a user saw
   was a half-cut chip. Wrapping costs one extra line of height and nothing is
   ever out of reach or out of sight. */
.goal-selector{display:flex;gap:6px;justify-content:center;margin:var(--s3) 0 0;
  flex-wrap:wrap;padding:2px 0}

.goal-btn{flex:0 0 auto}
.goal-btn{padding:0 16px;min-height:44px;display:inline-flex;align-items:center;
  border:1px solid var(--line);border-radius:var(--r-pill);
  background:var(--surface-2);color:var(--text-2);font-size:var(--fs-sm);font-weight:700;
  cursor:pointer;transition:border-color var(--t2) var(--ease),color var(--t2) var(--ease),
  background-color var(--t2) var(--ease)}
.goal-btn.active{border-color:var(--primary);color:var(--primary);background:var(--primary-dim)}

/* ---------- stats ---------- */
.stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s2)}
.stats-grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.stat-item{background:var(--surface-2);border:1px solid var(--line-soft);border-radius:var(--r);
  padding:12px 6px;text-align:center}
/* A statistic is not a control, so the untoned default is text colour, not
   the accent — the accent has one job and reading a number is not it. Tones
   are for values whose colour carries meaning. */
.stat-val{font-size:var(--fs-xl);font-weight:700;color:var(--text);
  font-variant-numeric:tabular-nums;letter-spacing:-.4px;line-height:1.25}
.stat-val.gold{color:var(--gold)}.stat-val.green{color:var(--green)}
.stat-val.blue{color:var(--blue)}.stat-val.purple{color:var(--purple)}
.stat-val.cyan{color:var(--cyan)}
.stat-label{font-size:9.5px;color:var(--text-3);margin-top:3px;line-height:1.35;font-weight:600}


.bar-chart{display:flex;align-items:flex-end;gap:6px;height:100px;margin-top:var(--s2)}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;
  justify-content:flex-end}
/* Height is the honest property here — the bar sits in a flex column above its
   labels, so scaling it would not move them. It animates on data change only,
   which is rare, not per frame. */
.bar{width:100%;border-radius:6px 6px 3px 3px;background:var(--primary);min-height:3px;
  transition:height var(--t3) var(--ease)}
.bar.dim{background:var(--surface-3);min-height:4px}
.bar-label{font-size:9.5px;color:var(--text-3);font-weight:600}
.bar-wrap{position:relative}
.bar-avg{position:absolute;inset-inline:0;height:0;border-top:1px dashed rgba(255,255,255,.28);
  pointer-events:none}

/* ---------- rows ---------- */
.row{display:flex;align-items:center;gap:var(--s2);padding:12px 14px;background:var(--surface-2);
  border:1px solid var(--line-soft);border-radius:var(--r);margin-bottom:6px;
  transition:background-color var(--t1) var(--ease)}
.row:active{background:var(--surface-3)}
.row-plain{display:flex;align-items:center;justify-content:space-between;padding:12px 2px;
  border-bottom:1px solid var(--line-soft)}
.row-plain:last-child{border-bottom:none}
.row-main{flex:1;min-width:0}
.row-title{font-size:var(--fs-md);font-weight:600;letter-spacing:-.1px}
.row-sub{font-size:var(--fs-xs);color:var(--text-3);margin-top:2px}
.row-end{font-size:var(--fs-sm);color:var(--text-2);white-space:nowrap;font-weight:600}
/* 44px is the smallest target a thumb hits reliably; the glyph stays 17px
   and the rest is transparent padding, so the row does not grow to pay for
   it. The negative margin claws back the extra width in dense rows. */
.icon-btn{background:none;border:none;color:var(--text-3);cursor:pointer;padding:0;
  display:flex;align-items:center;justify-content:center;
  min-width:44px;min-height:44px;margin:-4px;
  border-radius:var(--r-sm);transition:color var(--t2),background-color var(--t2)}
.icon-btn:active{background:var(--surface-3)}
.icon-btn.danger{color:var(--danger)}

/* ---------- inputs ---------- */
.search-input{width:100%;padding:12px 15px;background:var(--surface-2);border:1px solid var(--line);
  border-radius:var(--r);color:var(--text);font-size:var(--fs-md);outline:none;transition:border-color .2s}
.search-input:focus{border-color:var(--primary)}
.search-input::placeholder{color:var(--text-3)}
.setting-input{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-sm);
  padding:8px 11px;color:var(--text);font-size:var(--fs-md);width:108px;text-align:center;
  outline:none;font-weight:600;transition:border-color .2s}
.setting-input:focus{border-color:var(--primary)}
select.setting-input{width:136px;text-align:start}

/* The 27px track is the design; the target is not. A transparent overlay
   extends the hit area to 44px without moving anything in the row. */
.switch{width:46px;height:27px;border-radius:var(--r-pill);background:var(--surface-3);
  position:relative;border:1px solid var(--line);cursor:pointer;flex-shrink:0;
  transition:background-color var(--t2) var(--ease),border-color var(--t2) var(--ease)}
.switch::after{content:'';position:absolute;inset:-9px -2px;border-radius:var(--r-pill)}
.switch.on{background:var(--green);border-color:var(--green)}
.switch-knob{position:absolute;top:3px;inset-inline-start:3px;width:19px;height:19px;
  border-radius:50%;background:#fff;transition:transform var(--t2) var(--ease);
  box-shadow:0 1px 3px rgba(0,0,0,.4)}
.switch.on .switch-knob{transform:translateX(19px)}
[dir="rtl"] .switch.on .switch-knob{transform:translateX(-19px)}

.lang-toggle{display:flex;border-radius:var(--r-pill);overflow:hidden;border:1px solid var(--line);
  background:var(--surface-2)}
.lang-btn{padding:0 18px;min-height:44px;min-width:52px;border:none;font-size:var(--fs-sm);
  font-weight:700;cursor:pointer;background:transparent;color:var(--text-2);
  transition:background-color var(--t2) var(--ease),color var(--t2) var(--ease)}
.lang-btn.active{background:var(--primary);color:#fff}

.chip{display:inline-flex;align-items:center;gap:5px;padding:6px 11px;border-radius:var(--r-pill);
  font-size:var(--fs-xs);font-weight:600;background:var(--surface-2);color:var(--text-2);
  border:1px solid var(--line-soft)}
.chip.ok{color:var(--green);border-color:rgba(0,217,126,.3);background:var(--green-dim)}
.chip.warn{color:var(--gold);border-color:rgba(245,166,35,.3);background:var(--gold-dim)}
.chip.bad{color:var(--danger);border-color:rgba(255,77,94,.3);background:rgba(255,77,94,.12)}
.chip-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:var(--s3)}

.dot{width:8px;height:8px;border-radius:50%;background:var(--text-3);flex-shrink:0}
.dot.ok{background:var(--green);box-shadow:0 0 8px rgba(0,217,126,.6)}
.dot.warn{background:var(--gold);animation:pulse 1.3s infinite}
.dot.bad{background:var(--danger)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

/* ---------- coach / messages ---------- */
.tip-card{background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--r);
  padding:14px;margin-bottom:var(--s2);border-inline-start:3px solid var(--gold)}
.tip-title{font-size:var(--fs-sm);font-weight:700;color:var(--gold);margin-bottom:5px;
  display:flex;align-items:center;gap:6px}
.tip-text{font-size:var(--fs-sm);color:var(--text-2);line-height:1.8}
.tip-card.exercise{border-inline-start-color:var(--blue)}
.tip-card.exercise .tip-title{color:var(--blue)}
.tip-card.warn{border-inline-start-color:var(--danger)}
.tip-card.warn .tip-title{color:var(--danger)}
.tip-card.good{border-inline-start-color:var(--green)}
.tip-card.good .tip-title{color:var(--green)}
/* The armed state of a destructive row action. Sized to sit in the same
   44px slot the icon vacated so the row does not jump when it appears. */
.confirm-pill{min-height:44px;padding:0 14px;font-size:var(--fs-xs);white-space:nowrap;
  animation:confirmIn var(--t1) var(--ease) both}
@keyframes confirmIn{from{opacity:0;transform:scale(.86)}to{opacity:1;transform:none}}

/* ---------- personal analysis ---------- */
.pa-card{background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--r);
  padding:15px;margin-bottom:var(--s2);border-inline-start:3px solid var(--blue)}
.pa-card.high{border-inline-start-color:var(--danger)}
.pa-card.medium{border-inline-start-color:var(--gold)}
.pa-head{display:flex;align-items:flex-start;gap:8px;margin-bottom:8px}
.pa-title{font-size:var(--fs-md);font-weight:700;color:var(--text);flex:1;line-height:1.5}
.pa-body{font-size:var(--fs-sm);color:var(--text-2);line-height:1.95;white-space:pre-wrap}
.pa-body strong{color:var(--text);font-weight:700}
.pa-action{margin-top:11px;padding:9px 12px;background:var(--surface-2);border-radius:var(--r-sm);
  font-size:var(--fs-sm);font-weight:600;color:var(--text);display:flex;gap:7px;align-items:flex-start;
  line-height:1.7}
.pa-action::before{content:'→';color:var(--primary);font-weight:700;flex:none}
.sev{font-size:10px;font-weight:700;padding:3px 8px;border-radius:999px;white-space:nowrap;flex:none}
.sev-high{background:rgba(255,77,94,.14);color:#ff8b96}
.sev-medium{background:rgba(245,166,35,.14);color:var(--gold)}
.sev-info{background:rgba(61,139,253,.13);color:#8fbaff}

/* A signed number inside RTL text: without isolation the bidi algorithm
   moves the sign to the visual end, so "-0.71" renders as "0.71-". */
.num-ltr{direction:ltr;unicode-bidi:isolate;display:inline-block}

/* ---------- weekly review ---------- */
.wk-row{display:flex;align-items:center;gap:var(--s3);padding:11px 0;
  border-bottom:1px solid var(--line-soft)}
.wk-row:last-child{border-bottom:none}
.wk-label{flex:1;font-size:var(--fs-sm);color:var(--text-2)}
.wk-val{font-size:var(--fs-md);font-weight:700;font-variant-numeric:tabular-nums;min-width:54px;
  text-align:end}
.wk-delta{font-size:var(--fs-xs);font-weight:700;font-variant-numeric:tabular-nums;
  min-width:52px;text-align:end;direction:ltr;unicode-bidi:isolate}
.wk-delta.up{color:var(--green)}.wk-delta.down{color:var(--danger)}.wk-delta.flat{color:var(--text-3)}

/* ---------- recovery ---------- */
.rec-band{display:flex;align-items:center;gap:var(--s3);padding:13px 14px;border-radius:var(--r);
  background:var(--surface-2);margin-bottom:var(--s2)}
.rec-dot{width:10px;height:10px;border-radius:50%;flex:none}
.rec-good .rec-dot{background:var(--green)}
.rec-watch .rec-dot{background:var(--gold)}
.rec-strained .rec-dot{background:var(--danger)}
.rec-main{flex:1;min-width:0}
.rec-title{font-size:var(--fs-sm);font-weight:700}
.rec-sub{font-size:var(--fs-xs);color:var(--text-3);margin-top:2px}
.rec-num{font-size:var(--fs-lg);font-weight:700;font-variant-numeric:tabular-nums}

/* ---------- appearance picker ---------- */
.swatch-row{display:flex;gap:var(--s2);flex-wrap:wrap}
/* The dot reads better small, so the button is 44px and the colour is drawn
   by an inner circle rather than by the button's own background. */
.swatch{width:44px;height:44px;border-radius:50%;border:none;background:none;cursor:pointer;
  padding:0;display:flex;align-items:center;justify-content:center}
.swatch i{display:block;width:32px;height:32px;border-radius:50%;
  box-shadow:0 0 0 0 var(--text);
  transition:transform var(--t1) var(--ease),box-shadow var(--t1) var(--ease)}
/* The selection ring sits outside the dot rather than eating into it, so
   the chosen colour is not visually smaller than the others. */
.swatch.on i{box-shadow:0 0 0 3px var(--text);transform:scale(.94)}
.seg{display:flex;background:var(--surface-2);border-radius:var(--r-sm);padding:3px;gap:2px}
.seg-btn{flex:1;padding:0 10px;min-height:44px;border:none;background:none;border-radius:8px;
  font-size:var(--fs-sm);font-weight:600;color:var(--text-3);cursor:pointer;
  transition:background-color var(--t1) var(--ease),color var(--t1) var(--ease)}
.seg-btn.on{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}

/* ---------- ramadan ---------- */
.ram-strip{display:flex;gap:var(--s2);margin-bottom:var(--s2)}
.ram-cell{flex:1;background:var(--surface-2);border-radius:var(--r-sm);padding:11px 8px;
  text-align:center}
.ram-time{font-size:var(--fs-lg);font-weight:700;font-variant-numeric:tabular-nums;direction:ltr}
.ram-label{font-size:10px;color:var(--text-3);font-weight:600;margin-top:2px}

/* ---------- expert insights ---------- */
.section-sub{font-size:var(--fs-sm);color:var(--text-3);line-height:1.7;
  margin:calc(var(--s2) * -1) var(--s1) var(--s2)}
.insight-card{background:var(--surface);border:1px solid var(--line-soft);
  border-radius:var(--r);padding:14px;margin-bottom:var(--s2);
  border-inline-start:3px solid var(--gold)}
.insight-head{display:flex;align-items:center;gap:8px;margin-bottom:7px}
.insight-icon{font-size:16px;line-height:1}
.insight-title{font-size:var(--fs-sm);font-weight:700;color:var(--gold);flex:1}
.insight-text{font-size:var(--fs-sm);color:var(--text-2);line-height:1.85}
.insight-card.exercise{border-inline-start-color:var(--blue)}
.insight-card.exercise .insight-title{color:var(--blue)}
.insight-card.warn{border-inline-start-color:var(--danger)}
.insight-card.warn .insight-title{color:var(--danger)}
.insight-card.good{border-inline-start-color:var(--green)}
.insight-card.good .insight-title{color:var(--green)}
.prio{font-size:10px;font-weight:700;letter-spacing:.4px;padding:3px 8px;
  border-radius:999px;white-space:nowrap;flex:none}
.prio-1{background:rgba(255,77,94,.14);color:#ff8b96}
.prio-2{background:rgba(233,178,69,.14);color:var(--gold)}
.prio-3{background:rgba(255,255,255,.06);color:var(--text-3)}

.refeed-card{background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--r);
  padding:14px;margin-bottom:var(--s2);border-inline-start:3px solid var(--green)}
.refeed-phase{font-size:var(--fs-sm);font-weight:700;color:var(--green);margin-bottom:5px}
.alert-box{background:var(--danger-dim);border:1px solid var(--danger);border-radius:var(--r);
  padding:12px 14px;margin-top:var(--s3);font-size:var(--fs-sm);color:var(--danger);line-height:1.8}
/* Neutral on purpose. Tying this to the accent meant that picking amber made
   every explanatory note look like a warning; informational text does not
   need a hue, and one fewer coloured box on screen is a gain either way. */
.info-box{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r);
  padding:12px 14px;margin-top:var(--s3);font-size:var(--fs-sm);color:var(--text-2);line-height:1.8}

.liquid-item{display:flex;align-items:center;gap:var(--s3);padding:11px 14px;
  background:var(--surface-2);border-radius:var(--r);margin-bottom:6px;
  border:1px solid var(--line-soft);font-size:var(--fs-sm)}
.liquid-item.forbidden{border-color:rgba(255,77,94,.28);opacity:.72}
.liquid-emoji{font-size:18px}
.water-bar{height:10px;border-radius:var(--r-pill);background:var(--surface-3);overflow:hidden;
  margin:var(--s3) 0 6px}
/* A progress fill is the one place width is worth animating: it is a single
   element, and scaleX would stretch the gradient with it. */
.water-fill{height:100%;border-radius:var(--r-pill);
  background:linear-gradient(90deg,var(--blue),var(--cyan));
  transition:width var(--t3) var(--ease)}

/* ---------- modals ---------- */
.modal-overlay{position:fixed;inset:0;background:var(--scrim);backdrop-filter:blur(6px);
  -webkit-backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;
  z-index:100;padding:var(--s5);animation:fadeIn var(--t2) var(--ease)}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
  padding:var(--s5);width:100%;max-width:350px;box-shadow:var(--shadow-lg);max-height:86%;
  overflow-y:auto;animation:pop var(--t2) var(--ease)}
.modal h3{font-size:var(--fs-lg);margin-bottom:var(--s4);text-align:center;font-weight:700}
.modal-btns{display:flex;gap:var(--s2);margin-top:var(--s4);justify-content:center}
/* Clock time is written HH:MM left-to-right in Arabic too, so this row is
   pinned to LTR — in RTL the hours and minutes would otherwise swap sides
   and 23:07 would read as 07:23. */
.time-picker{display:flex;align-items:center;justify-content:center;gap:var(--s3);direction:ltr}
.time-col{display:flex;flex-direction:column;align-items:center;gap:4px}
.time-btn{width:48px;height:38px;border:1px solid var(--line);border-radius:var(--r-sm);
  background:var(--surface-2);color:var(--text);cursor:pointer;display:flex;
  align-items:center;justify-content:center}
.time-btn:active{background:var(--primary);border-color:var(--primary)}
.time-input{width:66px;padding:6px 0;background:var(--surface-2);border:1px solid var(--line);
  border-radius:var(--r-sm);color:var(--text);font-size:var(--fs-2xl);font-weight:700;
  text-align:center;font-variant-numeric:tabular-nums;outline:none;transition:border-color .2s}
.time-input:focus{border-color:var(--primary)}
.time-input::-webkit-outer-spin-button,.time-input::-webkit-inner-spin-button{
  -webkit-appearance:none;margin:0}
.time-sep{font-size:var(--fs-xl);color:var(--text-3);padding-bottom:6px}

.notif{position:fixed;top:calc(var(--header-h) + var(--safe-t) + 10px);inset-inline:var(--s4);
  background:var(--surface-3);border:1px solid var(--line);color:var(--text);padding:12px 18px;
  border-radius:var(--r);font-size:var(--fs-sm);font-weight:600;z-index:200;
  box-shadow:var(--shadow-lg);text-align:center;opacity:0;transform:translateY(-16px);
  transition:opacity var(--t2) var(--ease),transform .26s var(--ease);pointer-events:none}
.notif.show{opacity:1;transform:none}
.empty{text-align:center;color:var(--text-3);font-size:var(--fs-sm);padding:var(--s6) var(--s3);
  line-height:1.8}

/* ---------- check-in ---------- */
.scale-row{margin-bottom:var(--s4)}
.scale-label{font-size:var(--fs-sm);color:var(--text-2);margin-bottom:var(--s2);font-weight:600}
.scale-btns{display:flex;gap:6px}
.scale-btn{flex:1;padding:0;min-height:46px;display:flex;align-items:center;
  justify-content:center;border:1px solid var(--line);border-radius:var(--r);
  background:var(--surface-2);color:var(--text-2);font-size:17px;cursor:pointer;
  line-height:1.2;font-weight:600;
  transition:border-color var(--t2) var(--ease),color var(--t2) var(--ease),
  background-color var(--t2) var(--ease)}
.scale-btn.active{border-color:var(--primary);background:var(--primary-dim);color:var(--text);
  transform:translateY(-2px)}

/* ---------- sub view ---------- */
.subview{position:fixed;inset:0;background:var(--bg);z-index:60;display:flex;flex-direction:column;
  animation:slideUp var(--t2) var(--ease)}
.subview-hdr{height:calc(var(--header-h) + var(--safe-t));padding-top:var(--safe-t);flex-shrink:0;
  display:flex;align-items:center;gap:var(--s2);padding-inline:var(--s3);background:var(--surface);
  border-bottom:1px solid var(--line-soft)}
.subview-title{font-size:var(--fs-lg);font-weight:700}
.subview-body{flex:1;overflow-y:auto;padding:var(--s4);
  padding-bottom:calc(var(--safe-b) + var(--s6))}
.back-btn{background:none;border:none;color:var(--text);cursor:pointer;padding:6px;display:flex;
  border-radius:var(--r-sm)}
[dir="rtl"] .back-btn .ic{transform:scaleX(-1)}

.protein-target{font-size:var(--fs-sm);color:var(--text-2);font-weight:600}

/* ---------- exercise demonstrations ----------
   One rigged figure, animated per movement. Each group rotates about its own
   joint, so limbs stay attached; only transform is animated, so the whole
   library costs the compositor a few rotations and nothing else. */
.fig{width:64px;height:70px;flex:none;overflow:visible;
  stroke-width:5;stroke-linecap:round;fill:none}
.fig-head{fill:currentColor;stroke:none;color:inherit}
.fig .fig-head{fill:var(--primary)}
.fig-ground{stroke:var(--line);stroke-width:3}
.fig g{transform-box:fill-box}

/* Joint origins, expressed on the box of each group. */
.fig-torso{transform-origin:50% 100%}
.fig-arm{transform-origin:50% 0}
.fig-forearm{transform-origin:50% 0}
.fig-leg{transform-origin:50% 0}
.fig-shin{transform-origin:50% 0}
.fig-body{transform-origin:50% 100%}
/* Horizontal movements pivot about the figure's centre, not its feet: swung
   from the base, a 70-degree rotation throws the head clean out of the box. */
.fig-pushup .fig-body,.fig-plank .fig-body,.fig-bridge .fig-body{transform-origin:50% 50%}

/* Every movement is one loop, four seconds, ease-in-out both ways so the
   turnaround reads as a controlled rep rather than a bounce. */
.fig-squat .fig-body{animation:mSquatBody 4s var(--ease) infinite alternate}
.fig-squat .fig-leg{animation:mSquatThigh 4s var(--ease) infinite alternate}
.fig-squat .fig-shin{animation:mSquatShin 4s var(--ease) infinite alternate}
.fig-squat .fig-arm{animation:mSquatArm 4s var(--ease) infinite alternate}
@keyframes mSquatBody{to{transform:translateY(16px) rotate(14deg)}}
@keyframes mSquatThigh{to{transform:rotate(-42deg)}}
@keyframes mSquatShin{to{transform:rotate(46deg)}}
@keyframes mSquatArm{to{transform:rotate(-72deg)}}

.fig-pushup .fig-body{animation:mPushBody 3.4s var(--ease) infinite alternate}
.fig-pushup .fig-arm{animation:mPushArm 3.4s var(--ease) infinite alternate}
.fig-pushup .fig-forearm{animation:mPushFore 3.4s var(--ease) infinite alternate}
@keyframes mPushBody{from{transform:rotate(-74deg) translate(24px,-4px) scale(.9)}
  to{transform:rotate(-74deg) translate(24px,4px) scale(.9)}}
@keyframes mPushArm{to{transform:rotate(24deg)}}
@keyframes mPushFore{to{transform:rotate(-34deg)}}

.fig-row .fig-body{transform:translateX(10px)}
.fig-row .fig-torso{animation:mRowTorso 3.6s var(--ease) infinite}
.fig-row .fig-arm{animation:mRowArm 3.6s var(--ease) infinite alternate}
.fig-row .fig-forearm{animation:mRowFore 3.6s var(--ease) infinite alternate}
@keyframes mRowTorso{0%,100%{transform:rotate(-58deg)}}
@keyframes mRowArm{from{transform:rotate(60deg)}to{transform:rotate(6deg)}}
@keyframes mRowFore{to{transform:rotate(-44deg)}}

.fig-hinge .fig-body{transform:translateX(8px)}
.fig-hinge .fig-torso{animation:mHinge 4s var(--ease) infinite alternate}
.fig-hinge .fig-arm{animation:mHingeArm 4s var(--ease) infinite alternate}
.fig-hinge .fig-leg{animation:mHingeLeg 4s var(--ease) infinite alternate}
@keyframes mHinge{to{transform:rotate(-62deg)}}
@keyframes mHingeArm{to{transform:rotate(58deg)}}
@keyframes mHingeLeg{to{transform:rotate(9deg)}}

.fig-press .fig-arm{animation:mPressArm 3.2s var(--ease) infinite alternate}
.fig-press .fig-forearm{animation:mPressFore 3.2s var(--ease) infinite alternate}
@keyframes mPressArm{from{transform:rotate(-118deg)}to{transform:rotate(-172deg)}}
@keyframes mPressFore{from{transform:rotate(96deg)}to{transform:rotate(4deg)}}

.fig-lunge .fig-body{animation:mLungeBody 4s var(--ease) infinite alternate}
.fig-lunge .fig-leg{animation:mLungeLeg 4s var(--ease) infinite alternate}
.fig-lunge .fig-shin{animation:mLungeShin 4s var(--ease) infinite alternate}
@keyframes mLungeBody{to{transform:translateY(15px)}}
@keyframes mLungeLeg{from{transform:rotate(-26deg)}to{transform:rotate(-46deg)}}
@keyframes mLungeShin{from{transform:rotate(26deg)}to{transform:rotate(50deg)}}

/* A hold, not a rep: the only movement is the breath. */
.fig-plank .fig-body{animation:mPlank 4.4s ease-in-out infinite alternate}
.fig-plank .fig-arm{transform:rotate(76deg)}
@keyframes mPlank{from{transform:rotate(-78deg) translate(28px,0)}
  to{transform:rotate(-78deg) translate(28px,0) scale(1.015)}}

.fig-bridge .fig-body{transform:rotate(-88deg) translate(30px,4px)}
.fig-bridge .fig-torso{animation:mBridge 3.6s var(--ease) infinite alternate}
.fig-bridge .fig-leg{transform:rotate(56deg)}
.fig-bridge .fig-shin{transform:rotate(-104deg)}
@keyframes mBridge{to{transform:rotate(20deg)}}

.ex-card{background:var(--surface);border:1px solid var(--line-soft);
  border-radius:var(--r-lg);margin-bottom:var(--s2);overflow:hidden}
.ex-head{display:flex;align-items:center;gap:var(--s3);width:100%;padding:var(--s3) var(--s4);
  background:none;border:none;cursor:pointer;text-align:start;min-height:44px}
.ex-fig{display:flex;align-items:center;justify-content:center;width:64px;height:70px;
  background:var(--surface-2);border-radius:var(--r);flex:none;overflow:hidden}
.ex-main{flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-start;gap:4px}
.ex-name{font-size:var(--fs-md);font-weight:700;color:var(--text)}
.ex-muscles{font-size:var(--fs-xs);color:var(--text-3)}
.ex-body{padding:0 var(--s4) var(--s4);animation:tabIn var(--t2) var(--ease) both}
.ex-cues{padding-inline-start:var(--s5);margin:0}
.ex-cues li{font-size:var(--fs-sm);color:var(--text-2);line-height:1.85;margin-bottom:5px}

/* ---------- settings index ---------- */
.nav-list{background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--r-lg);
  overflow:hidden}
.nav-row{display:flex;align-items:center;gap:var(--s3);width:100%;min-height:62px;
  padding:10px var(--s4);background:none;border:none;cursor:pointer;text-align:start;
  border-bottom:1px solid var(--line-soft);transition:background-color var(--t1) var(--ease)}
.nav-row:last-child{border-bottom:none}
.nav-row:active{background:var(--surface-2)}
.nav-ico{display:flex;align-items:center;justify-content:center;width:34px;height:34px;
  border-radius:var(--r-sm);background:var(--primary-dim);color:var(--primary);flex:none}
.nav-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.nav-title{font-size:var(--fs-md);font-weight:700;color:var(--text)}
.nav-hint{font-size:var(--fs-xs);color:var(--text-3);line-height:1.45}
.nav-chev{color:var(--text-3);display:flex;flex:none}
/* The chevron points the way the language runs. */
.nav-chev .ic{transform:scaleX(-1)}
[dir="rtl"] .nav-chev .ic{transform:none}

/* ---------- feature bits ---------- */
.map-box{background:var(--surface-2);border:1px solid var(--line-soft);border-radius:var(--r);
  height:210px;display:flex;align-items:center;justify-content:center;overflow:hidden;
  margin-bottom:var(--s3)}
.map-empty{color:var(--text-3);font-size:var(--fs-sm);text-align:center;padding:0 var(--s5);line-height:1.8}
.photo-thumb{width:46px;height:46px;border-radius:var(--r-sm);object-fit:cover;flex-shrink:0;
  background:var(--surface-3)}
.photo-preview{width:100%;max-height:180px;object-fit:cover;border-radius:var(--r);margin-top:var(--s3)}
.sensor-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
.sensor-cell{display:flex;align-items:center;gap:7px;padding:10px 12px;background:var(--surface-2);
  border:1px solid var(--line-soft);border-radius:var(--r-sm);font-size:var(--fs-xs);font-weight:600}
.sensor-cell.off{opacity:.4}
.sensor-cell .ic{color:var(--green)}
.sensor-cell.off .ic{color:var(--text-3)}

/* ---------- onboarding ---------- */
.onb{position:fixed;inset:0;background:var(--bg);z-index:300;display:flex;flex-direction:column;
  padding:var(--s5);padding-top:calc(var(--safe-t) + var(--s6));
  padding-bottom:calc(var(--safe-b) + var(--s5));animation:fadeIn var(--t2) var(--ease)}
.onb-body{flex:1;overflow-y:auto}
.onb-step{font-size:var(--fs-xs);color:var(--text-3);font-weight:700;letter-spacing:1.4px;
  text-transform:uppercase}
.onb-title{font-size:var(--fs-2xl);font-weight:700;margin-top:6px;letter-spacing:-.6px;line-height:1.3}
.onb-desc{font-size:var(--fs-md);color:var(--text-2);margin-top:var(--s3);line-height:1.85}
.onb-dots{display:flex;gap:6px;justify-content:center;margin-bottom:var(--s4)}
/* "all" animates every property that ever changes, including layout ones
   nobody intended; the two that matter are named instead. */
.onb-dot{width:7px;height:7px;border-radius:50%;background:var(--surface-3);
  transition:width var(--t2) var(--ease),background-color var(--t2) var(--ease)}
.onb-dot.on{background:var(--primary);width:20px;border-radius:var(--r-pill)}
.onb-hero{display:flex;align-items:center;justify-content:center;padding:var(--s6) 0}
.onb-hero .ic{color:var(--primary);filter:drop-shadow(0 0 26px rgba(233,69,96,.35))}


/* ---------- dashboard tiles ----------
   The structural change: a grid of small metric tiles that each open a
   detail view, instead of one long column of tall cards. This is what
   separates a dashboard from a scrolling report. */
.tile-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:var(--s2)}
.tile{background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--r-lg);
  padding:13px 14px;text-align:start;cursor:pointer;position:relative;overflow:hidden;
  display:flex;flex-direction:column;gap:2px;min-height:112px;
  transition:transform var(--t1) var(--ease),border-color .2s}
.tile:active{transform:scale(.975);border-color:var(--line)}
.tile-head{display:flex;align-items:center;gap:6px;color:var(--text-3);
  font-size:var(--fs-xs);font-weight:700}
.tile-head .ic{width:14px;height:14px}
.tile-val{font-size:23px;font-weight:700;letter-spacing:-.7px;line-height:1.15;
  font-variant-numeric:tabular-nums;margin-top:2px}
.tile-unit{font-size:var(--fs-xs);color:var(--text-3);font-weight:600;margin-inline-start:3px}
.tile-sub{font-size:10px;color:var(--text-3);font-weight:600}
.tile-spark{margin-top:auto;height:30px;width:100%;opacity:.95}
.tile-empty .tile-val{color:var(--text-3)}

/* ---------- charts ---------- */
.chart-box{width:100%;overflow:hidden}
.chart-legend{display:flex;gap:var(--s3);flex-wrap:wrap;font-size:var(--fs-xs);
  color:var(--text-3);font-weight:600;margin-top:var(--s2)}
.chart-legend i{display:inline-block;width:9px;height:9px;border-radius:3px;
  margin-inline-end:5px;vertical-align:-1px}

/* ---------- detail sheet ---------- */
.sheet{position:fixed;inset:0;background:var(--bg);z-index:70;display:flex;flex-direction:column;
  animation:slideUp var(--t2) var(--ease)}
.sheet-hdr{height:calc(var(--header-h) + var(--safe-t));padding-top:var(--safe-t);flex-shrink:0;
  display:flex;align-items:center;gap:var(--s2);padding-inline:var(--s3);
  background:var(--surface);border-bottom:1px solid var(--line-soft)}
.sheet-body{flex:1;overflow-y:auto;padding:var(--s4);
  padding-bottom:calc(var(--safe-b) + var(--s6))}
.sheet-hero{text-align:center;padding:var(--s4) 0 var(--s2)}
.sheet-hero-val{font-size:44px;font-weight:700;letter-spacing:-1.6px;line-height:1.1;
  font-variant-numeric:tabular-nums}
.sheet-hero-label{font-size:var(--fs-sm);color:var(--text-3);font-weight:600;margin-top:2px}

/* ---------- hero timer, trimmed ---------- */
.hero{background:radial-gradient(120% 80% at 50% 0%,rgba(233,69,96,.10),transparent 60%),
  var(--surface);border:1px solid var(--line-soft);border-radius:24px;
  padding:var(--s4) var(--s4) var(--s5);margin-bottom:var(--s3);box-shadow:var(--shadow)}

::-webkit-scrollbar{width:0;height:0}
</style>
</head>
<body>
<div id="root"></div>
<script src="react.min.js"></script>
<script src="react-dom.min.js"></script>
<script src="utils.js"></script>
<script src="app.js"></script>
</body>
</html>
