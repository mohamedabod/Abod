<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0f0f1a">
<title>Aboud Sayem</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0f0f1a;--bg-soft:#15152a;--card:#1e1e36;--card-hover:#2a2a4a;
  --primary:#e94560;--primary-dark:#c73550;--gold:#f5a623;--green:#00e676;
  --blue:#2196f3;--purple:#9c27b0;--cyan:#00bcd4;
  --text:#fff;--text-sec:#a0a0c0;--text-dim:#6c6c8a;
  --border:#2a2a4a;--danger:#ff4444;
  --shadow:0 4px 15px rgba(0,0,0,0.3);
  --radius:16px;--radius-sm:10px;--nav-h:62px;--header-h:54px;
  --safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px)
}
html,body{width:100%;height:100%;background:var(--bg);color:var(--text);
  font-family:'Segoe UI',Roboto,Arial,sans-serif;font-size:16px;overflow:hidden;
  -webkit-overflow-scrolling:touch;-webkit-user-select:none;user-select:none}
#root{width:100%;height:100%;display:flex;flex-direction:column}

/* ---------- shell ---------- */
.hdr{height:calc(var(--header-h) + var(--safe-t));padding-top:var(--safe-t);
  display:flex;align-items:center;justify-content:space-between;padding-inline:14px;
  background:var(--card);position:relative;z-index:10;border-bottom:1px solid var(--border);flex-shrink:0}
.hdr-title{font-size:18px;font-weight:700;color:var(--primary)}
.hdr-side{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--text-sec)}
.hdr-chip{display:flex;align-items:center;gap:4px;background:var(--bg);padding:4px 9px;border-radius:20px;font-size:11px}
.content{flex:1;overflow-y:auto;overflow-x:hidden;padding:14px;
  padding-bottom:calc(var(--nav-h) + var(--safe-b) + 18px);-webkit-overflow-scrolling:touch}
.bnav{height:calc(var(--nav-h) + var(--safe-b));padding-bottom:var(--safe-b);display:flex;
  align-items:stretch;background:var(--card);border-top:1px solid var(--border);flex-shrink:0;z-index:10}
.bnav-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:none;border:none;color:var(--text-dim);font-size:10px;cursor:pointer;gap:3px;padding:4px 0;font-family:inherit}
.bnav-item.active{color:var(--primary)}
.bnav-icon{font-size:19px;line-height:1}

/* ---------- cards ---------- */
.card{background:var(--card);border-radius:var(--radius);padding:16px;margin-bottom:14px;box-shadow:var(--shadow)}
.card-flat{background:var(--bg-soft);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:12px}
.card-title{font-size:14px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:7px}
.card-sub{font-size:12px;color:var(--text-sec);line-height:1.6}
.section-title{font-size:12px;color:var(--text-dim);font-weight:700;letter-spacing:1px;
  text-transform:uppercase;margin:18px 4px 10px}

/* ---------- timer ---------- */
.ring-wrap{position:relative;width:236px;height:236px;margin:6px auto 4px}
.ring-svg{transform:rotate(-90deg)}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.timer-time{font-size:38px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:1px;line-height:1.1}
.timer-goal{font-size:12px;color:var(--text-sec);margin-top:5px}
.timer-pct{font-size:14px;font-weight:700;color:var(--gold);margin-top:3px}
.timer-state{font-size:11px;color:var(--text-dim);margin-top:6px;letter-spacing:2px;text-transform:uppercase}

.phase-name{text-align:center;font-size:17px;font-weight:700;margin-top:6px}
.phase-desc{text-align:center;font-size:12px;color:var(--text-sec);margin-top:4px;line-height:1.6;padding:0 8px}
.phase-next{text-align:center;font-size:11px;color:var(--text-dim);margin-top:6px}

.timeline{display:flex;height:9px;border-radius:5px;overflow:hidden;background:var(--border);margin:14px 0 6px;gap:2px}
.timeline-seg{flex:1;background:var(--border);transition:background .3s}
.timeline-labels{display:flex;justify-content:space-between;font-size:9px;color:var(--text-dim);margin-bottom:4px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:12px 22px;border:none;
  border-radius:var(--radius-sm);font-size:14px;font-weight:700;color:#fff;cursor:pointer;font-family:inherit;
  transition:background .2s,transform .1s}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--primary)}
.btn-gold{background:var(--gold);color:#1a1a1a}
.btn-green{background:var(--green);color:#0b2b19}
.btn-danger{background:var(--danger)}
.btn-outline{background:transparent;border:1.5px solid var(--border);color:var(--text-sec)}
.btn-sm{padding:8px 14px;font-size:12px;border-radius:8px}
.btn-block{width:100%}
.btn-group{display:flex;gap:9px;justify-content:center;flex-wrap:wrap;margin-top:14px}

.goal-selector{display:flex;gap:7px;justify-content:center;margin:10px 0 4px;flex-wrap:wrap}
.goal-btn{padding:7px 13px;border:1.5px solid var(--border);border-radius:18px;background:transparent;
  color:var(--text-sec);font-size:12px;font-weight:700;cursor:pointer;font-family:inherit}
.goal-btn.active{border-color:var(--primary);color:var(--primary);background:rgba(233,69,96,.12)}

/* ---------- stats ---------- */
.stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.stats-grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stat-item{background:var(--bg-soft);border:1px solid var(--border);border-radius:var(--radius-sm);
  padding:11px 6px;text-align:center}
.stat-val{font-size:18px;font-weight:700;color:var(--primary);font-variant-numeric:tabular-nums}
.stat-val.gold{color:var(--gold)}.stat-val.green{color:var(--green)}.stat-val.blue{color:var(--blue)}
.stat-label{font-size:9.5px;color:var(--text-dim);margin-top:3px;line-height:1.3}

.live-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.live-metric{flex:1;text-align:center}
.live-val{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.live-unit{font-size:10px;color:var(--text-dim);margin-top:2px}
.hr-pulse{animation:beat 1s ease-in-out infinite}
@keyframes beat{0%,100%{transform:scale(1)}18%{transform:scale(1.16)}36%{transform:scale(1)}}

.bar-chart{display:flex;align-items:flex-end;gap:6px;height:96px;margin-top:6px}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.bar{width:100%;border-radius:5px 5px 0 0;background:var(--primary);min-height:3px;transition:height .4s}
.bar.dim{background:#31315a;min-height:4px}
.bar-label{font-size:9px;color:var(--text-dim)}

/* ---------- lists ---------- */
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 13px;
  background:var(--bg-soft);border-radius:var(--radius-sm);margin-bottom:7px;border:1px solid transparent}
.row:active{background:var(--card-hover)}
.row-plain{display:flex;align-items:center;justify-content:space-between;padding:11px 2px;border-bottom:1px solid var(--border)}
.row-plain:last-child{border-bottom:none}
.row-main{flex:1;min-width:0}
.row-title{font-size:14px;font-weight:600}
.row-sub{font-size:11px;color:var(--text-dim);margin-top:2px}
.row-end{font-size:13px;color:var(--text-sec);white-space:nowrap}
.icon-btn{background:none;border:none;color:var(--text-dim);font-size:17px;cursor:pointer;padding:5px 7px;font-family:inherit}
.icon-btn.danger{color:var(--danger)}

.search-input{width:100%;padding:11px 14px;background:var(--bg-soft);border:1px solid var(--border);
  border-radius:var(--radius-sm);color:#fff;font-size:14px;outline:none;font-family:inherit}
.search-input:focus{border-color:var(--primary)}
.search-input::placeholder{color:var(--text-dim)}
.setting-input{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:7px 10px;
  color:#fff;font-size:14px;width:104px;text-align:center;outline:none;font-family:inherit}
.setting-input:focus{border-color:var(--primary)}
select.setting-input{width:132px;text-align:start}

.switch{width:44px;height:25px;border-radius:14px;background:var(--border);position:relative;
  border:none;cursor:pointer;flex-shrink:0;transition:background .2s}
.switch.on{background:var(--green)}
.switch-knob{position:absolute;top:3px;inset-inline-start:3px;width:19px;height:19px;border-radius:50%;
  background:#fff;transition:transform .2s}
.switch.on .switch-knob{transform:translateX(19px)}
[dir="rtl"] .switch.on .switch-knob{transform:translateX(-19px)}

.lang-toggle{display:flex;border-radius:8px;overflow:hidden;border:1px solid var(--border)}
.lang-btn{padding:7px 15px;border:none;font-size:13px;font-weight:700;cursor:pointer;
  background:transparent;color:var(--text-sec);font-family:inherit}
.lang-btn.active{background:var(--primary);color:#fff}

.chip{display:inline-flex;align-items:center;gap:5px;padding:5px 11px;border-radius:16px;
  font-size:11px;font-weight:600;background:var(--bg-soft);color:var(--text-sec);border:1px solid var(--border)}
.chip.ok{color:var(--green);border-color:rgba(0,230,118,.35)}
.chip.warn{color:var(--gold);border-color:rgba(245,166,35,.35)}
.chip.bad{color:var(--danger);border-color:rgba(255,68,68,.35)}
.chip-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}

.dot{width:9px;height:9px;border-radius:50%;background:var(--text-dim);flex-shrink:0}
.dot.ok{background:var(--green)}.dot.warn{background:var(--gold);animation:pulse 1.2s infinite}
.dot.bad{background:var(--danger)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

.tip-card{background:linear-gradient(135deg,var(--card) 0%,#2a1a3e 100%);border-radius:var(--radius);
  padding:14px;margin-bottom:9px;border-inline-start:4px solid var(--gold)}
.tip-title{font-size:13px;font-weight:700;color:var(--gold);margin-bottom:5px}
.tip-text{font-size:12.5px;color:var(--text-sec);line-height:1.7}
.tip-card.exercise{background:linear-gradient(135deg,var(--card) 0%,#1a2a3e 100%);border-color:var(--blue)}
.tip-card.exercise .tip-title{color:var(--blue)}
.tip-card.warn{background:linear-gradient(135deg,var(--card) 0%,#3e1a1a 100%);border-color:var(--danger)}
.tip-card.warn .tip-title{color:var(--danger)}
.tip-card.good{background:linear-gradient(135deg,var(--card) 0%,#14301f 100%);border-color:var(--green)}
.tip-card.good .tip-title{color:var(--green)}

.refeed-card{background:linear-gradient(135deg,var(--card) 0%,#1a2a1e 100%);border-radius:var(--radius);
  padding:14px;margin-bottom:10px;border-inline-start:4px solid var(--green)}
.refeed-phase{font-size:13px;font-weight:700;color:var(--green);margin-bottom:5px}
.alert-box{background:rgba(255,68,68,.1);border:1px solid var(--danger);border-radius:10px;
  padding:11px 13px;margin-top:10px;font-size:12.5px;color:#ff9a9a;line-height:1.7}
.info-box{background:rgba(33,150,243,.1);border:1px solid rgba(33,150,243,.4);border-radius:10px;
  padding:11px 13px;margin-top:10px;font-size:12.5px;color:#9fd0ff;line-height:1.7}

.liquid-item{display:flex;align-items:center;gap:10px;padding:10px 13px;background:var(--bg-soft);
  border-radius:var(--radius-sm);margin-bottom:6px;border:1px solid transparent}
.liquid-item.forbidden{border-color:rgba(255,68,68,.4);opacity:.75}
.liquid-emoji{font-size:19px}
.water-bar{height:12px;border-radius:6px;background:var(--border);overflow:hidden;margin:10px 0 6px}
.water-fill{height:100%;background:linear-gradient(90deg,#2196f3,#00bcd4);transition:width .4s}

.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;align-items:center;
  justify-content:center;z-index:100;padding:20px}
.modal{background:var(--card);border-radius:var(--radius);padding:20px;width:100%;max-width:340px;
  box-shadow:0 8px 32px rgba(0,0,0,.55);max-height:86%;overflow-y:auto}
.modal h3{font-size:16px;margin-bottom:16px;text-align:center}
.modal-btns{display:flex;gap:10px;margin-top:16px;justify-content:center}
.time-picker{display:flex;align-items:center;justify-content:center;gap:10px}
.time-col{display:flex;flex-direction:column;align-items:center}
.time-btn{width:46px;height:36px;border:none;border-radius:8px;background:var(--card-hover);
  color:#fff;font-size:18px;cursor:pointer;font-family:inherit}
.time-btn:active{background:var(--primary)}
.time-val{font-size:30px;font-weight:700;padding:5px 0;font-variant-numeric:tabular-nums;min-width:52px;text-align:center}
.time-sep{font-size:24px;color:var(--text-sec);padding-bottom:5px}

.notif{position:fixed;top:calc(var(--header-h) + var(--safe-t) + 8px);inset-inline:16px;
  background:var(--primary);color:#fff;padding:11px 18px;border-radius:var(--radius-sm);font-size:13px;
  font-weight:600;z-index:200;box-shadow:0 4px 20px rgba(233,69,96,.4);text-align:center;
  opacity:0;transform:translateY(-24px);transition:opacity .25s,transform .25s;pointer-events:none}
.notif.show{opacity:1;transform:translateY(0)}
.empty{text-align:center;color:var(--text-dim);font-size:13px;padding:26px 10px;line-height:1.7}

/* ---------- check-in scale ---------- */
.scale-row{margin-bottom:14px}
.scale-label{font-size:13px;color:var(--text-sec);margin-bottom:7px}
.scale-btns{display:flex;gap:6px}
.scale-btn{flex:1;padding:9px 0;border:1.5px solid var(--border);border-radius:10px;background:var(--bg-soft);
  color:var(--text-sec);font-size:17px;cursor:pointer;font-family:inherit;line-height:1.2}
.scale-btn.active{border-color:var(--primary);background:rgba(233,69,96,.15);color:#fff}

/* ---------- activity hub ---------- */
.subview{position:fixed;inset:0;background:var(--bg);z-index:60;display:flex;flex-direction:column}
.subview-hdr{height:calc(var(--header-h) + var(--safe-t));padding-top:var(--safe-t);flex-shrink:0;
  display:flex;align-items:center;gap:10px;padding-inline:12px;background:var(--card);
  border-bottom:1px solid var(--border)}
.subview-title{font-size:16px;font-weight:700}
.subview-body{flex:1;overflow-y:auto;padding:14px;padding-bottom:calc(var(--safe-b) + 24px)}
.back-btn{background:none;border:none;color:var(--text);font-size:20px;cursor:pointer;padding:4px 8px;font-family:inherit}
[dir="rtl"] .back-btn{transform:scaleX(-1)}

.pulse-big{font-size:52px;font-weight:700;text-align:center;color:var(--primary);
  font-variant-numeric:tabular-nums;line-height:1.1}
.pulse-sub{text-align:center;font-size:12px;color:var(--text-sec);margin-top:4px}
.progress-track{height:8px;border-radius:4px;background:var(--border);overflow:hidden;margin:12px 0}
.progress-fill{height:100%;background:var(--primary);transition:width .4s}

.map-box{background:var(--bg-soft);border:1px solid var(--border);border-radius:var(--radius);
  height:210px;display:flex;align-items:center;justify-content:center;overflow:hidden;margin-bottom:12px}
.map-empty{color:var(--text-dim);font-size:12.5px;text-align:center;padding:0 20px;line-height:1.7}

.photo-thumb{width:44px;height:44px;border-radius:8px;object-fit:cover;flex-shrink:0;background:var(--bg)}
.photo-preview{width:100%;max-height:180px;object-fit:cover;border-radius:var(--radius-sm);margin-top:10px}
.sensor-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}
.sensor-cell{display:flex;align-items:center;gap:7px;padding:9px 11px;background:var(--bg-soft);
  border:1px solid var(--border);border-radius:var(--radius-sm);font-size:12px}
.sensor-cell.off{opacity:.45}
::-webkit-scrollbar{width:0;height:0}
</style>
</head>
<body>
<div id="root"></div>
<script src="react.min.js"></script>
<script src="react-dom.min.js"></script>
<script src="utils.js"></script>
<script src="app.js"></script>
</body>
</html>
