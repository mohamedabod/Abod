name: Build APK

on:
  push:
    branches: ['**']
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # The release keystore is intentionally NOT in the repository: it is
      # public, and the key is what lets an update install over the existing
      # app. Add it as a base64 secret to get a signed build out of CI.
      - name: Restore keystore
        if: ${{ secrets.SAYEM_KEYSTORE_B64 != '' }}
        run: echo "${{ secrets.SAYEM_KEYSTORE_B64 }}" | base64 -d > sayem-key.jks

      - name: Build
        env:
          SAYEM_STOREPASS: ${{ secrets.SAYEM_STOREPASS }}
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: aboud-sayem-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
